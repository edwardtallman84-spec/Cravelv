services:
  - type: web
    name: cravelv
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "wsgi:app" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: PUBLIC_BASE_URL
        value: https://cravelv-v6sy.onrender.com
      - key: SCHEDULER_ENABLED
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: cravelv-db
          property: connectionString
databases:
  - name: cravelv-db
    plan: free
    databaseName: cravelv
    user: cravelv
