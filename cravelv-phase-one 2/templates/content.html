{% extends 'base.html' %}{% block content %}<header><div><h1>Content calendar</h1><p>Keep every brand active without repeating the same message.</p></div></header>
<section class="panel"><h2>Add post</h2><form method="post" action="/posts" class="form-grid"><select name="brand_id">{% for b in brands %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select><select name="platform"><option>Instagram</option><option>Facebook</option><option>Both</option></select><select name="content_type"><option>Reel</option><option>Photo</option><option>Story</option><option>Carousel</option></select><input type="date" name="scheduled_for" required><textarea name="caption" placeholder="Caption" required></textarea><select name="status"><option>Draft</option><option>Ready</option><option>Published</option></select><button>Add to calendar</button></form></section>
<section class="panel"><h2>Scheduled posts</h2>{% for p in posts %}<article class="post"><div class="post-top"><b>{{p.brand_name}} · {{p.platform}} {{p.content_type}}</b><span>{{p.scheduled_for}}</span></div><p>{{p.caption}}</p><form method="post" action="/posts/{{p.id}}/status" class="inline"><select name="status"><option {% if p.status=='Draft' %}selected{% endif %}>Draft</option><option {% if p.status=='Ready' %}selected{% endif %}>Ready</option><option {% if p.status=='Published' %}selected{% endif %}>Published</option></select><button>Update</button></form></article>{% endfor %}</section>{% endblock %}
